kind = "web"
previewPath = "/"
title = "STONEBRIDGE"
version = "1.0.0"
id = "artifacts/stonebridge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21714

[services.development]
run = "npm --workspace @workspace/stonebridge run dev"

[services.production]
build = [ "npm", "--workspace", "@workspace/stonebridge", "run", "build" ]
publicDir = "artifacts/stonebridge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21714"
BASE_PATH = "/"
